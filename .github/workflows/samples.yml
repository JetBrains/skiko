name: Samples

on:
  workflow_call:

jobs:
  android:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'
      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'
      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'
      - shell: bash
        name: 'Get Skiko Version'
        run: |
          version=$(./gradlew -p skiko --no-daemon -q properties | sed -n 's/^version: //p')
          test -n "$version"
          echo "SKIKO_VERSION=$version" >> "$GITHUB_ENV"
      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish Skiko to Maven Local'
        with:
          image_name: linux-compat
          command: |
            ./gradlew -p skiko --no-daemon --stacktrace \
              -Pskiko.android.enabled=true \
              publishToMavenLocal
      - uses: ./.github/actions/docker-skiko-run
        name: 'Check Android Sample'
        with:
          image_name: linux-compat
          working_directory: samples/SkiaAndroidSample
          command: |
            ./gradlew --no-daemon --stacktrace -Pskiko.version=${{ env.SKIKO_VERSION }} packageRelease

  web:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'
      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'
      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'
      - shell: bash
        name: 'Get Skiko Version'
        run: |
          version=$(./gradlew -p skiko --no-daemon -q properties | sed -n 's/^version: //p')
          test -n "$version"
          echo "SKIKO_VERSION=$version" >> "$GITHUB_ENV"
      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish Skiko to Maven Local'
        with:
          image_name: linux-emscripten-amd64
          command: |
            ./gradlew -p skiko --no-daemon --stacktrace \
              -Pskiko.wasm.enabled=true -Pskiko.emsdk.dir="\$EMSDK_DIR" \
              publishToMavenLocal
      - shell: bash
        name: 'Compile Web Samples'
        run: |
          for project in samples/SkiaWebSample samples/SkiaMultiplatformSample samples/SkikoExtensionsSample; do
            ./gradlew -p "$project" --no-daemon --stacktrace \
              -Pskiko.version="$SKIKO_VERSION" compileKotlinJs compileKotlinWasmJs
          done
      - uses: actions/setup-node@v4
        name: 'Setup Node.js'
        with:
          node-version: 22

      - shell: bash
        name: 'Setup Playwright'
        run: |
          npm install --prefix "${RUNNER_TEMP}/skiko-playwright" @playwright/test@1.56.1
          "${RUNNER_TEMP}/skiko-playwright/node_modules/.bin/playwright" install --with-deps chromium
      - shell: bash
        name: 'Check Skiko Extensions Web Sample'
        env:
          GRADLE_USER_HOME: ${{ runner.temp }}/skiko-extensions-gradle
          NODE_PATH: ${{ runner.temp }}/skiko-playwright/node_modules
          PLAYWRIGHT_BIN: ${{ runner.temp }}/skiko-playwright/node_modules/.bin/playwright
          JAVA_TOOL_OPTIONS: -Dorg.gradle.project.skiko.version=${{ env.SKIKO_VERSION }}
        run: bash samples/SkikoExtensionsSample/scripts/check-web-sample.sh

  linux:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'
      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'
      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'
      - shell: bash
        name: 'Get Skiko Version'
        run: |
          version=$(./gradlew -p skiko --no-daemon -q properties | sed -n 's/^version: //p')
          test -n "$version"
          echo "SKIKO_VERSION=$version" >> "$GITHUB_ENV"
      - uses: ./.github/actions/docker-skiko-run
        name: 'Publish Skiko to Maven Local'
        with:
          image_name: linux-compat
          command: |
            ./gradlew -p skiko --no-daemon --stacktrace \
              -Pskiko.awt.enabled=true \
              publishToMavenLocal
      - uses: ./.github/actions/docker-skiko-run
        name: 'Check AWT Sample'
        with:
          image_name: linux-compat
          command: |
            ./gradlew --no-daemon --stacktrace -Pskiko.version=${{ env.SKIKO_VERSION }} :SkiaAwtSample:installDist

      - uses: ./.github/actions/docker-skiko-run
        name: 'Compile JVM Samples'
        with:
          image_name: linux-compat
          command: |
            set -e
            ./gradlew -p samples/SkiaMultiplatformSample --no-daemon --stacktrace \
              -Pskiko.version=${{ env.SKIKO_VERSION }} compileKotlinAwt
            ./gradlew -p samples/SkikoExtensionsSample --no-daemon --stacktrace \
              -Pskiko.version=${{ env.SKIKO_VERSION }} compileKotlinAwt

      - uses: ./.github/actions/docker-skiko-run
        name: 'Check Skiko Extensions Sample'
        with:
          image_name: linux-compat
          virtual-display: true
          command: |
            ./gradlew -p samples/SkikoExtensionsSample --no-daemon --stacktrace \
              -Pskiko.version=${{ env.SKIKO_VERSION }} :runAwt --args=--exit-after-ms=5000

  macos:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'
      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'
      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'
      - shell: bash
        name: 'Get Skiko Version'
        run: |
          version=$(./gradlew -p skiko --no-daemon -q properties | sed -n 's/^version: //p')
          test -n "$version"
          echo "SKIKO_VERSION=$version" >> "$GITHUB_ENV"
      - shell: bash
        name: 'Publish Skiko to Maven Local'
        run: |
          ./gradlew -p skiko --no-daemon --stacktrace \
            -Pskiko.native.enabled=true -Pskiko.awt.enabled=true -Pskiko.arch=arm64 \
            publishToMavenLocal
      - shell: bash
        name: 'Publish AWT Runtime x64 to Maven Local'
        run: |
          ./gradlew -p skiko --no-daemon --stacktrace \
            -Pskiko.awt.enabled=true -Pskiko.arch=x64 \
            publishSkikoJvmRuntimeMacosX64PublicationToMavenLocal
      - shell: bash
        name: 'Check AWT Sample'
        run: ./gradlew --no-daemon --stacktrace -Pskiko.version="$SKIKO_VERSION" :SkiaAwtSample:installDist

      - shell: bash
        name: 'Check Skiko Extensions Sample'
        run: |
          ./gradlew -p samples/SkikoExtensionsSample --no-daemon --stacktrace \
            -Pskiko.version="$SKIKO_VERSION" :runAwt --args=--exit-after-ms=5000

      - shell: bash
        name: 'Check Skiko Extensions Apple Native Sample'
        run: |
          ./gradlew -p samples/SkikoExtensionsSample --no-daemon --stacktrace \
            -Pskiko.version="$SKIKO_VERSION" -Psample.exitAfterMs=5000 :runNative \
            :linkDebugExecutableMacosArm64 :linkDebugExecutableMacosX64 \
            :linkDebugExecutableIosArm64 :linkDebugExecutableIosSimulatorArm64 :linkDebugExecutableIosX64

      - shell: bash
        name: 'Compile Multiplatform Sample Apple Targets'
        run: |
          ./gradlew -p samples/SkiaMultiplatformSample --no-daemon --stacktrace \
            -Pskiko.version="$SKIKO_VERSION" \
            compileKotlinMacosArm64 compileKotlinMacosX64 compileKotlinIosSimulatorArm64 \
            compileKotlinTvosArm64 compileKotlinTvosSimulatorArm64 compileKotlinTvosX64

  windows:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'
      - uses: microsoft/setup-msbuild@v1
      - uses: ilammy/msvc-dev-cmd@v1
      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'
      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'
      - shell: bash
        name: 'Get Skiko Version'
        run: |
          version=$(./gradlew -p skiko --no-daemon -q properties | sed -n 's/^version: //p')
          test -n "$version"
          echo "SKIKO_VERSION=$version" >> "$GITHUB_ENV"
      - shell: bash
        name: 'Publish Skiko to Maven Local'
        run: |
          ./gradlew -p skiko --no-daemon --stacktrace \
            -Pskiko.native.enabled=true -Pskiko.awt.enabled=true -Pskiko.arch=x64 publishToMavenLocal

      - shell: bash
        name: 'Check AWT Sample'
        run: ./gradlew --no-daemon --stacktrace -Pskiko.version="$SKIKO_VERSION" :SkiaAwtSample:installDist

      - shell: bash
        name: 'Check Skiko Extensions Sample'
        run: |
          ./gradlew -p samples/SkikoExtensionsSample --no-daemon --stacktrace \
            -Pskiko.version="$SKIKO_VERSION" :runAwt --args=--exit-after-ms=5000
