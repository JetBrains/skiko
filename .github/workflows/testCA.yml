name: Certificate Tests

on:
  workflow_dispatch:
  pull_request:
  push:
    branches:
      - igor.demin/eMudhra-fix-test

env:
  IMAGE_TAG: master # Set to an existing published image tag

jobs:
  ubuntu-2404:
    runs-on: ubuntu-24.04
    name: ubuntu-2404
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Run Test
        shell: bash
        run: bash ./scripts/securityTest_eMudhraCA.sh

      - name: Test existing Linux Docker images
        if: always()
        shell: bash
        run: |
          failed=0

          for name in \
            linux-amd64 \
            linux-compat \
            linux-emscripten-amd64 \
            linux-android-amd64
          do
            image="ghcr.io/${GITHUB_REPOSITORY,,}/${name}:${IMAGE_TAG}"
            echo "::group::${name}"

            if docker pull "$image"; then
              docker run --rm \
                --mount "type=bind,source=${GITHUB_WORKSPACE},target=/workspace" \
                --workdir /workspace \
                "$image" \
                bash ./scripts/securityTest_eMudhraCA.sh \
                || failed=1
            else
              failed=1
            fi

            echo "::endgroup::"
          done

          exit "$failed"

  ubuntu-2404-arm:
    runs-on: ubuntu-24.04-arm
    name: ubuntu-2404-arm
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'

      - name: Run Test
        if: always()
        shell: bash
        run: bash ./scripts/securityTest_eMudhraCA.sh

  macos-15:
    runs-on: macos-15
    name: macos-15
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Prerequisites
        uses: ./.github/actions/setup-prerequisites

      - name: Run Test
        if: always()
        shell: bash
        run: bash ./scripts/securityTest_eMudhraCA.sh

  macos-latest:
    runs-on: macos-latest
    name: macos-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v5

      - name: Setup Prerequisites
        uses: ./.github/actions/setup-prerequisites

      - name: Run Test
        if: always()
        shell: bash
        run: bash ./scripts/securityTest_eMudhraCA.sh

  windows:
    runs-on: windows-2022
    name: Windows
    steps:
      - uses: actions/checkout@v4
        name: 'Check out code'

      - uses: microsoft/setup-msbuild@v1

      - uses: ilammy/msvc-dev-cmd@v1

      - uses: actions/setup-java@v4
        name: 'Setup JDK 21'
        with:
          java-version: '21'
          distribution: 'corretto'

      - uses: ./.github/actions/setup-prerequisites
        name: 'Setup Prerequisites'

      - name: Run Test
        if: always()
        shell: bash
        run: bash ./scripts/securityTest_eMudhraCA.sh

      - name: 'windows-amd64 docker'
        if: always()
        timeout-minutes: 25
        shell: pwsh
        run: |
          $repository = $env:GITHUB_REPOSITORY.ToLowerInvariant()
          $image = "ghcr.io/${repository}/windows-amd64:$($env:IMAGE_TAG)"

          docker pull $image
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          docker run --rm `
            --mount "type=bind,source=$env:GITHUB_WORKSPACE,target=C:\workspace" `
            --workdir C:\workspace `
            --entrypoint 'C:\Git\bin\bash.exe' `
            $image --noprofile --norc -c 'bash ./scripts/securityTest_eMudhraCA.sh'
          exit $LASTEXITCODE